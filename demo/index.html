<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>typoseek demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 40rem;
        padding: 1rem;
        color: #1a1a1a;
        background: #ffffff;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        border: 2px solid #1a1a1a;
        border-radius: 4px;
      }
      input:focus-visible {
        outline: 3px solid #0b57d0;
        outline-offset: 2px;
      }
      #status {
        margin: 0.75rem 0;
        color: #404040;
      }
      ul {
        padding-left: 1.25rem;
      }
      li {
        margin-bottom: 0.25rem;
      }
      .author {
        color: #404040;
      }
      mark {
        background: #ffe58f;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>typoseek demo</h1>
      <p>Search 24 books by title or author. Typos are tolerated.</p>
      <label for="query">Search books</label>
      <input
        id="query"
        type="search"
        autocomplete="off"
      />
      <p
        id="status"
        role="status"
        aria-live="polite"
      ></p>
      <ul id="results"></ul>
    </main>
    <script
      src="dist/main.iife.js"
      defer
    ></script>
  </body>
</html>
